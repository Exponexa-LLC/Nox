name: testes

# Sem credenciais, sem rede para o Claude, sem conexão remota: as suítes usam
# runners injetados. Caminhos são relativos ao checkout.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    # Windows é a plataforma em que as suítes foram validadas. Linux e macOS
    # entram quando forem verificados de fato — não antes.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: instalar dependências
        run: python -m pip install --upgrade pip textual

      - name: py_compile
        run: python -m py_compile (Get-ChildItem nox/*.py)
        shell: pwsh

      - name: suítes
        shell: pwsh
        run: |
          $suites = @(
            "test_packaging", "test_policy", "test_resilience", "test_remote",
            "test_identity", "test_models", "test_backend", "test_layout",
            "test_copy", "test_autocomplete", "test_pickers"
          )
          $falhas = 0
          foreach ($s in $suites) {
            Write-Host "=== $s ==="
            python -m nox.$s
            if ($LASTEXITCODE -ne 0) { $falhas++ }
          }
          if ($falhas -gt 0) { throw "$falhas suíte(s) falharam" }
